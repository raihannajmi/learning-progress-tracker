version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: learning_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: learning_progress_tracker
    ports:
      - "5434:5432"
    volumes:
      - learning_tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_progress_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  learning_tracker_pgdata:
